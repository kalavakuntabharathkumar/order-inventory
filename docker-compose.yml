services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: retail_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql

  user-service:
    build: ./user-service
    environment: [DB_URL=jdbc:postgresql://postgres:5432/retail_platform]
    depends_on: [postgres]
    ports: ["8081:8081"]

  inventory-service:
    build: ./inventory-service
    environment: [DB_URL=jdbc:postgresql://postgres:5432/retail_platform]
    depends_on: [postgres]
    ports: ["8082:8082"]

  order-service:
    build: ./order-service
    environment: [DB_URL=jdbc:postgresql://postgres:5432/retail_platform, INVENTORY_URL=http://inventory-service:8082]
    depends_on: [postgres, inventory-service]
    ports: ["8083:8083"]

  notification-service:
    build: ./notification-service
    ports: ["8084:8084"]

  frontend:
    build: ./frontend
    depends_on: [order-service, inventory-service]
    ports: ["3000:80"]
